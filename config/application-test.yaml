# 可直接运行：python -m app.main --config config/application-test.yaml
# 三个任务均不联网、不需要账号，直接返回业务结果，不抛出模拟异常。
# 邮件默认关闭；设置 MAIL_ENABLED=true 并填写 SMTP 环境变量后，会发送真实测试邮件。
logging:
  level: ${LOG_LEVEL:INFO}

tasks:
  # 键是实例名，type 对应 plugins/<type>/plugin.py。
  # 同一 type 可以配置多个实例；未填写 type 时使用实例名。
  success:
    type: demo_success
    enabled: true
    config:
      message: 签到成功（模拟）

  already_signed:
    type: demo_already_signed
    enabled: true
    config:
      message: 今日已签到，无需重复签到（模拟）

  failure:
    type: demo_failure
    enabled: true
    config:
      message: 签到失败（模拟）

notification:
  enabled: ${NOTIFICATION_ENABLED:true}
  channels:
    screen:
      type: console
      enabled: true
      policy: always
      config: {}
    failure_mail:
      type: email
      enabled: ${MAIL_ENABLED:false}
      # failure 任务启用时发邮件；将该任务 enabled 改为 false，可验证成功/跳过不发邮件。
      policy: error_only
      config:
        host: ${SMTP_HOST}
        # SSL 通常用 465；STARTTLS 通常用 587，需要同时调整端口和 security。
        port: ${SMTP_PORT:465}
        security: ${SMTP_SECURITY:ssl}
        username: ${SMTP_USERNAME}
        password: ${SMTP_PASSWORD}
        sender: ${MAIL_FROM}
        sender_name: 日常签到助手
        recipients: ["${MAIL_TO}"]
        subject: "[框架测试] 模拟签到失败通知"
        timeout: 20

# 实际插件可在 config 中使用 ${ENV_NAME} 或 ${ENV_NAME:default}。
# enabled=false 的任务不会导入模块，也不检查其私有配置中的环境变量。
