# 可直接运行：python -m app.main --config config/application-example.yaml
# 真实站点任务默认禁用；离线演示任务已备份到 application-test.yaml。
logging:
  level: ${LOG_LEVEL:INFO}

tasks:
  picacg:
    type: picacg
    enabled: false
    config:
      # 由框架统一解析环境变量，不自动加载 .env。
      username: ${PICA_USERNAME}
      password: ${PICA_PASSWORD}
      timeout: 15
      max_retries: 2
      proxy_mode: system
  # 键是实例名，type 对应 plugins/<type>/plugin.py。
  # 同一 type 可以配置多个实例；未填写 type 时使用实例名。
  jm:
    type: jmcomic
    enabled: false
    config:
      username: ${JM_USERNAME}
      password: ${JM_PASSWORD}
      timeout: 20
      max_retries: 1
      # -1、false 或 0 不等待；正整数表示随机等待 0～N 秒，仅在任务开始时等待一次。
      random_delay_seconds: -1
      # 内嵌网络选项，省略时自动获取域名并使用系统代理。
      jmcomic_config: {}
      # jmcomic_config:
      #   domains: [api.example.com]
      #   proxies:
      #     http: ${JM_PROXY_URL}
      #     https: ${JM_PROXY_URL}
      #   headers:
      #     User-Agent: your-user-agent

notification:
  enabled: ${NOTIFICATION_ENABLED:true}
  # error_only 仅在出现 FAILED / TIMEOUT 时发送，重复签到不算错误。
  policy: ${NOTIFICATION_POLICY:always}
  channel:
    type: console
    config: {}

# 实际插件可在 config 中使用 ${ENV_NAME} 或 ${ENV_NAME:default}。
# enabled=false 的任务不会导入模块，也不检查其私有配置中的环境变量。
