# 可直接运行：python -m app.main --config config/application-example.yaml
# 真实站点任务默认禁用；离线演示任务已备份到 application-test.yaml。
logging:
  level: ${LOG_LEVEL:INFO}

tasks:
  picacg:
    type: picacg
    enabled: false
    config:
      # 由框架统一解析环境变量，不自动加载 .env。
      username: ${PICA_USERNAME}
      password: ${PICA_PASSWORD}
      timeout: 15
      max_retries: 2
      proxy_mode: system
  # 键是实例名，type 对应 plugins/<type>/plugin.py。
  # 同一 type 可以配置多个实例；未填写 type 时使用实例名。
  jm:
    type: jmcomic
    enabled: false
    config:
      username: ${JM_USERNAME}
      password: ${JM_PASSWORD}
      timeout: 20
      max_retries: 1
      # -1、false 或 0 不等待；正整数表示随机等待 0～N 秒，仅在任务开始时等待一次。
      random_delay_seconds: -1
      # 内嵌网络选项，省略时自动获取域名并使用系统代理。
      jmcomic_config: {}
      # jmcomic_config:
      #   domains: [api.example.com]
      #   proxies:
      #     http: ${JM_PROXY_URL}
      #     https: ${JM_PROXY_URL}
      #   headers:
      #     User-Agent: your-user-agent

notification:
  enabled: ${NOTIFICATION_ENABLED:true}
  channels:
    screen:
      type: console
      policy: always
      config: {}
    failure_mail:
      type: email
      # 配置 SMTP 环境变量后启用；成功或重复签到不会发邮件。
      enabled: false
      policy: error_only
      config:
        host: ${SMTP_HOST}
        port: 465
        security: ssl
        username: ${SMTP_USERNAME}
        password: ${SMTP_PASSWORD}
        sender: ${MAIL_FROM}
        sender_name: 日常签到助手
        recipients: ["${MAIL_TO}"]
        subject: 日常签到失败通知
        timeout: 20

# 通知详细配置与开发说明：docs/notification-development.md
